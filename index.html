<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AGRI ROBO | Control</title>

<!-- MQTT.js -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #174d2c,
            #071b10 55%,
            #020805
        );

    color: white;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;
}


/* =========================================================
   LOGIN
========================================================= */

#loginPage {

    width: 100%;

    max-width: 420px;

    padding: 35px;

    text-align: center;

    background:
        rgba(255,255,255,0.08);

    border:
        1px solid
        rgba(255,255,255,0.15);

    border-radius: 25px;

    backdrop-filter: blur(15px);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,0.5);
}

.logo {

    font-size: 60px;

    margin-bottom: 10px;
}

#loginPage h1 {

    font-size: 32px;

    margin-bottom: 8px;
}

.subtitle {

    color: #a8d8b5;

    margin-bottom: 30px;
}

input {

    width: 100%;

    padding: 15px;

    margin: 8px 0;

    border: none;

    border-radius: 12px;

    outline: none;

    background:
        rgba(255,255,255,0.12);

    color: white;

    font-size: 16px;
}

input::placeholder {

    color: #aaa;
}

.loginButton {

    width: 100%;

    margin-top: 15px;

    padding: 15px;

    border: none;

    border-radius: 12px;

    background: #28a745;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}

.loginButton:hover {

    background: #35c653;
}

#error {

    margin-top: 15px;

    color: #ff6b6b;

    min-height: 20px;
}


/* =========================================================
   CONTROL PAGE
========================================================= */

#controlPage {

    display: none;

    width: 100%;

    max-width: 700px;
}

.header {

    text-align: center;

    margin-bottom: 20px;
}

.header h1 {

    font-size: 36px;
}

.header p {

    color: #a8d8b5;

    margin-top: 5px;
}


/* =========================================================
   STATUS
========================================================= */

.status {

    text-align: center;

    background:
        rgba(255,255,255,0.08);

    padding: 18px;

    border-radius: 15px;

    margin-bottom: 25px;

    line-height: 1.8;
}

.status span {

    font-weight: bold;

    color: #54e879;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;

    max-width: 500px;

    margin: auto;
}

.control {

    min-height: 110px;

    border: none;

    border-radius: 20px;

    font-size: 40px;

    cursor: pointer;

    background:
        rgba(255,255,255,0.12);

    color: white;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,0.3);

    transition: 0.12s;

    user-select: none;

    -webkit-user-select: none;

    touch-action: none;
}

.control:active {

    transform: scale(0.92);
}

.forward {

    grid-column: 2;
}

.left {

    grid-column: 1;

    grid-row: 2;
}

.stop {

    grid-column: 2;

    grid-row: 2;

    background: #c62828;
}

.right {

    grid-column: 3;

    grid-row: 2;
}

.backward {

    grid-column: 2;

    grid-row: 3;
}


/* =========================================================
   INFO
========================================================= */

.info {

    margin-top: 30px;

    padding: 18px;

    border-radius: 15px;

    background:
        rgba(255,255,255,0.06);

    text-align: center;

    color: #aaa;

    line-height: 1.7;
}

.logout {

    margin-top: 15px;

    padding: 10px 20px;

    border:
        1px solid #555;

    border-radius: 10px;

    background: transparent;

    color: white;

    cursor: pointer;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px) {

    .control {

        min-height: 85px;

        font-size: 32px;
    }

    .header h1 {

        font-size: 28px;
    }

}

</style>

</head>


<body>


<!-- ========================================================
     LOGIN
========================================================= -->

<div id="loginPage">

    <div class="logo">
        🌱🤖
    </div>

    <h1>
        AGRI ROBO
    </h1>

    <div class="subtitle">
        Owner Control System
    </div>

    <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="off"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button
        class="loginButton"
        onclick="login()"
    >
        LOGIN
    </button>

    <div id="error"></div>

</div>


<!-- ========================================================
     CONTROL PAGE
========================================================= -->

<div id="controlPage">

    <div class="header">

        <h1>
            🌱 AGRI ROBO 🤖
        </h1>

        <p>
            Smart Agricultural Rover
        </p>

    </div>


    <div class="status">

        MQTT:
        <span id="connection">
            Disconnected
        </span>

        <br>

        Command:
        <span id="command">
            STOP
        </span>

    </div>


    <div class="controls">


        <!-- FORWARD -->

        <button
            class="control forward"
            id="forwardButton"
        >
            ⬆️
        </button>


        <!-- LEFT -->

        <button
            class="control left"
            id="leftButton"
        >
            ⬅️
        </button>


        <!-- STOP -->

        <button
            class="control stop"
            onclick="sendCommand('stop')"
        >
            🛑
        </button>


        <!-- RIGHT -->

        <button
            class="control right"
            id="rightButton"
        >
            ➡️
        </button>


        <!-- BACKWARD -->

        <button
            class="control backward"
            id="backwardButton"
        >
            ⬇️
        </button>


    </div>


    <div class="info">

        <p>
            Hold a direction button to move.
        </p>

        <p>
            Release it to stop.
        </p>

        <button
            class="logout"
            onclick="logout()"
        >
            LOGOUT
        </button>

    </div>

</div>


<script>

/* =========================================================
   SETTINGS
========================================================= */

/*
    IP address of the Ubuntu computer
    running Mosquitto.

    Example:
    10.200.40.133

    CHANGE THIS if your laptop IP is different.
*/

const MQTT_BROKER_IP = "10.200.40.133";


/*
    Mosquitto WebSocket port
*/

const MQTT_PORT = 9001;


/*
    MQTT topic
*/

const MQTT_TOPIC = "agri-robo/motor";


/*
    Website login
*/

const OWNER_USERNAME = "owner";

const OWNER_PASSWORD = "agri123";


/* =========================================================
   MQTT
========================================================= */

let mqttClient = null;


/* =========================================================
   LOGIN
========================================================= */

function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    if (
        username === OWNER_USERNAME &&
        password === OWNER_PASSWORD
    ) {

        document.getElementById("loginPage")
            .style.display = "none";

        document.getElementById("controlPage")
            .style.display = "block";

        document.getElementById("error")
            .innerText = "";

        connectMQTT();

    }

    else {

        document.getElementById("error")
            .innerText =
            "Incorrect username or password.";

    }

}


/* =========================================================
   MQTT CONNECT
========================================================= */

function connectMQTT() {

    const brokerURL =
        "ws://" +
        MQTT_BROKER_IP +
        ":" +
        MQTT_PORT;


    setConnection("Connecting...");


    console.log(
        "Connecting to MQTT:",
        brokerURL
    );


    mqttClient = mqtt.connect(
        brokerURL,
        {

            clientId:
                "agri-web-" +
                Math.random()
                    .toString(16)
                    .substring(2),

            clean: true,

            reconnectPeriod: 2000,

            connectTimeout: 5000

        }
    );


    mqttClient.on(
        "connect",
        function() {

            console.log(
                "MQTT connected"
            );

            setConnection(
                "Connected"
            );

        }
    );


    mqttClient.on(
        "reconnect",
        function() {

            setConnection(
                "Reconnecting..."
            );

        }
    );


    mqttClient.on(
        "error",
        function(error) {

            console.error(
                "MQTT error:",
                error
            );

            setConnection(
                "Connection error"
            );

        }
    );


    mqttClient.on(
        "close",
        function() {

            setConnection(
                "Disconnected"
            );

        }
    );

}


/* =========================================================
   SEND MQTT COMMAND
========================================================= */

function sendCommand(command) {

    if (
        mqttClient === null ||
        !mqttClient.connected
    ) {

        setConnection(
            "Not connected"
        );

        return;

    }


    mqttClient.publish(
        MQTT_TOPIC,
        command,
        {
            qos: 0,
            retain: false
        }
    );


    document.getElementById("command")
        .innerText =
        command.toUpperCase();


    console.log(
        "Command:",
        command
    );

}


/* =========================================================
   CONNECTION STATUS
========================================================= */

function setConnection(text) {

    document.getElementById(
        "connection"
    ).innerText = text;

}


/* =========================================================
   HOLD-TO-MOVE
========================================================= */

let moving = false;


function startMove(command) {

    if (moving) {
        return;
    }

    moving = true;

    sendCommand(command);

}


function stopMove() {

    if (!moving) {
        return;
    }

    moving = false;

    sendCommand("stop");

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

function setupButton(
    id,
    command
) {

    const button =
        document.getElementById(id);


    /* Mouse */

    button.addEventListener(
        "mousedown",
        function(event) {

            event.preventDefault();

            startMove(command);

        }
    );


    button.addEventListener(
        "mouseup",
        function(event) {

            event.preventDefault();

            stopMove();

        }
    );


    button.addEventListener(
        "mouseleave",
        function() {

            stopMove();

        }
    );


    /* Touch */

    button.addEventListener(
        "touchstart",
        function(event) {

            event.preventDefault();

            startMove(command);

        },
        {
            passive: false
        }
    );


    button.addEventListener(
        "touchend",
        function(event) {

            event.preventDefault();

            stopMove();

        },
        {
            passive: false
        }
    );


    button.addEventListener(
        "touchcancel",
        function(event) {

            event.preventDefault();

            stopMove();

        },
        {
            passive: false
        }
    );

}


/* =========================================================
   SETUP DIRECTION BUTTONS
========================================================= */

setupButton(
    "forwardButton",
    "forward"
);

setupButton(
    "backwardButton",
    "backward"
);

setupButton(
    "leftButton",
    "left"
);

setupButton(
    "rightButton",
    "right"
);


/* =========================================================
   SAFETY STOP
========================================================= */

/*
    If the browser tab loses focus,
    stop the rover.
*/

window.addEventListener(
    "blur",
    function() {

        stopMove();

    }
);


/*
    If the page is closed,
    try to stop the rover.
*/

window.addEventListener(
    "beforeunload",
    function() {

        try {

            sendCommand("stop");

        } catch (e) {}

    }
);


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

    sendCommand("stop");


    if (mqttClient) {

        mqttClient.end();

        mqttClient = null;

    }


    document.getElementById(
        "controlPage"
    ).style.display = "none";


    document.getElementById(
        "loginPage"
    ).style.display = "block";


    document.getElementById(
        "username"
    ).value = "";


    document.getElementById(
        "password"
    ).value = "";


    setConnection(
        "Disconnected"
    );

}

</script>


</body>

</html>
