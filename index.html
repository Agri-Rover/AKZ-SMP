<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agri Robo</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #183d25, #07110b 55%, #030705);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 500px;
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.logo {
    font-size: 55px;
}

h1 {
    font-size: 34px;
    color: #6cff8d;
    letter-spacing: 2px;
}

.subtitle {
    color: #a8b8ad;
    margin-top: 5px;
}

.panel {
    background: rgba(15, 30, 20, 0.94);
    border: 1px solid #285c38;
    border-radius: 25px;
    padding: 25px;
    box-shadow: 0 15px 50px rgba(0,0,0,.5);
}

.status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    background: #09160d;
    border-radius: 15px;
    margin-bottom: 25px;
}

.status-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #ff3b30;
}

.status-dot.connected {
    background: #35e875;
    box-shadow: 0 0 15px #35e875;
}

#statusText {
    color: #ddd;
}

.command {
    text-align: center;
    margin-bottom: 20px;
    min-height: 30px;
}

#commandText {
    color: #6cff8d;
    font-size: 20px;
    font-weight: bold;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    max-width: 350px;
    margin: auto;
}

.btn {
    height: 90px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(145deg, #214f2e, #102718);
    color: white;
    font-size: 34px;
    cursor: pointer;
    border: 1px solid #39734a;
    box-shadow: 0 7px 0 #07140a;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    transition: .08s;
}

.btn:hover {
    background: linear-gradient(145deg, #2d6a3d, #16351f);
}

.btn:active,
.btn.pressed {
    transform: translateY(6px);
    box-shadow: 0 1px 0 #07140a;
    background: #2f8a48;
}

.stop {
    background: linear-gradient(145deg, #702d2d, #351313);
    border-color: #a34a4a;
}

.stop:hover {
    background: #8d3333;
}

.center {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 17px;
    font-weight: bold;
}

.info {
    margin-top: 25px;
    background: #08140c;
    border-radius: 15px;
    padding: 15px;
    color: #8ea396;
    font-size: 13px;
    line-height: 1.7;
}

.footer {
    text-align: center;
    margin-top: 18px;
    color: #53685a;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">🌱🤖</div>
        <h1>AGRI ROBO</h1>
        <div class="subtitle">Smart Agricultural Rover</div>
    </div>

    <div class="panel">

        <div class="status">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">Connecting to MQTT...</span>
        </div>

        <div class="command">
            Command:
            <span id="commandText">STOP</span>
        </div>

        <div class="controls">

            <div></div>

            <button class="btn"
                    id="forward"
                    data-command="forward">
                ▲
            </button>

            <div></div>

            <button class="btn"
                    id="left"
                    data-command="left">
                ◀
            </button>

            <button class="btn stop"
                    id="stop"
                    data-command="stop">
                ■
            </button>

            <button class="btn"
                    id="right"
                    data-command="right">
                ▶
            </button>

            <div></div>

            <button class="btn"
                    id="backward"
                    data-command="backward">
                ▼
            </button>

            <div></div>

        </div>

        <div class="info">
            <b>Controls</b><br>
            Hold a direction button to drive.<br>
            Release the button to automatically stop.
        </div>

    </div>

    <div class="footer">
        AGRI ROBO • MQTT CONTROL SYSTEM
    </div>

</div>

<script>

const MQTT_BROKER_IP = "ws://192.168.1.20:9001";
const MQTT_PORT = 9001;
const MQTT_TOPIC = "agri-robo/motor";

let client = null;
let currentCommand = "stop";

const statusText = document.getElementById("statusText");
const statusDot = document.getElementById("statusDot");
const commandText = document.getElementById("commandText");

function setStatus(text, connected) {
    statusText.textContent = text;

    if (connected) {
        statusDot.classList.add("connected");
    } else {
        statusDot.classList.remove("connected");
    }
}

function updateCommand(command) {
    commandText.textContent = command.toUpperCase();
}

function publish(command) {

    if (!client || !client.connected) {
        console.log("MQTT not connected");
        return;
    }

    client.publish(
        MQTT_TOPIC,
        command,
        {
            qos: 0,
            retain: false
        }
    );

    currentCommand = command;
    updateCommand(command);

    console.log("COMMAND:", command);
}

function stopRobo() {
    publish("stop");
}

function connectMQTT() {

    const url = `ws://${MQTT_BROKER_IP}:${MQTT_PORT}`;

    console.log("Connecting to:", url);

    client = mqtt.connect(url, {
        clientId:
            "agri_web_" +
            Math.random().toString(16).substring(2),
        reconnectPeriod: 2000,
        connectTimeout: 5000
    });

    client.on("connect", function () {

        console.log("MQTT CONNECTED");

        setStatus("MQTT Connected", true);

        publish("stop");
    });

    client.on("reconnect", function () {

        setStatus("Reconnecting...", false);

    });

    client.on("offline", function () {

        setStatus("MQTT Offline", false);

    });

    client.on("error", function (error) {

        console.error("MQTT ERROR:", error);

        setStatus("MQTT Error", false);

    });

    client.on("close", function () {

        setStatus("MQTT Disconnected", false);

    });
}

const buttons = document.querySelectorAll(
    ".btn[data-command]"
);

buttons.forEach(button => {

    const command = button.dataset.command;

    function start() {

        if (command === "stop") {
            publish("stop");
            return;
        }

        button.classList.add("pressed");

        publish(command);
    }

    function release() {

        button.classList.remove("pressed");

        if (command !== "stop") {
            stopRobo();
        }
    }

    button.addEventListener("mousedown", start);
    button.addEventListener("mouseup", release);
    button.addEventListener("mouseleave", release);

    button.addEventListener("touchstart", function(e) {
        e.preventDefault();
        start();
    }, {passive:false});

    button.addEventListener("touchend", function(e) {
        e.preventDefault();
        release();
    }, {passive:false});

    button.addEventListener("touchcancel", release);
});

window.addEventListener("blur", function() {
    stopRobo();
});

document.addEventListener("visibilitychange", function() {

    if (document.hidden) {
        stopRobo();
    }

});

connectMQTT();

</script>

</body>
</html>
