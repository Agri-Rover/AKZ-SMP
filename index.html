<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agri Robo | Control Panel</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, #164e36, transparent 40%),
        radial-gradient(circle at bottom right, #0b3d2e, transparent 40%),
        #06130f;
    color: white;
}


/* ================================
   LOGIN
================================ */

#loginPage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.loginBox {
    width: 100%;
    max-width: 400px;
    padding: 35px;
    border-radius: 25px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    text-align: center;
}

.logo {
    font-size: 60px;
    margin-bottom: 10px;
}

.loginBox h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.loginBox p {
    color: #a8c9bc;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.3);
    color: white;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #38d996;
}

button {
    border: none;
    cursor: pointer;
    color: white;
    font-weight: bold;
}

.loginButton {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border-radius: 12px;
    background: #18a66a;
    font-size: 16px;
}

.loginButton:hover {
    background: #20c77e;
}

#errorMessage {
    color: #ff6b6b;
    margin-top: 15px;
    display: none;
}


/* ================================
   MAIN APP
================================ */

#app {
    display: none;
}

header {
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.2);
}

.brand {
    font-size: 22px;
    font-weight: bold;
}

.brand span {
    color: #36df91;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
}

.statusDot {
    width: 10px;
    height: 10px;
    background: #ff4444;
    border-radius: 50%;
}

.statusDot.online {
    background: #30e890;
    box-shadow: 0 0 12px #30e890;
}


/* ================================
   HERO
================================ */

.hero {
    text-align: center;
    padding: 45px 20px 25px;
}

.hero h1 {
    font-size: clamp(35px, 7vw, 70px);
    margin-bottom: 10px;
}

.hero h1 span {
    color: #35dc8e;
}

.hero p {
    color: #9ebdb0;
}


/* ================================
   CONTROL PANEL
================================ */

.container {
    width: 92%;
    max-width: 1100px;
    margin: auto;
}

.panel {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 25px;
    padding: 25px;
    margin-bottom: 25px;
    backdrop-filter: blur(15px);
}


/* ================================
   CONNECTION
================================ */

.connection {
    display: flex;
    gap: 10px;
}

.connection input {
    margin: 0;
    flex: 1;
}

.connectButton {
    padding: 0 25px;
    border-radius: 12px;
    background: #18a66a;
}

.connectButton:hover {
    background: #20c77e;
}


/* ================================
   ROBOT
================================ */

.robot {
    text-align: center;
}

.robotEmoji {
    font-size: 90px;
    margin: 20px;
}

.robotState {
    font-size: 20px;
    font-weight: bold;
    color: #38df91;
}


/* ================================
   CONTROLS
================================ */

.controls {
    display: grid;
    grid-template-columns: repeat(3, 90px);
    grid-template-rows: repeat(3, 90px);
    gap: 12px;
    justify-content: center;
    margin-top: 25px;
}

.controlButton {
    width: 90px;
    height: 90px;
    border-radius: 20px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    font-size: 30px;
    transition: 0.15s;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

.controlButton:hover {
    background: rgba(35,210,130,0.3);
}

.controlButton:active,
.controlButton.active {
    background: #18a66a;
    transform: scale(0.94);
}

.forward {
    grid-column: 2;
    grid-row: 1;
}

.left {
    grid-column: 1;
    grid-row: 2;
}

.stop {
    grid-column: 2;
    grid-row: 2;
    background: #a52828;
}

.stop:hover {
    background: #d83232;
}

.right {
    grid-column: 3;
    grid-row: 2;
}

.backward {
    grid-column: 2;
    grid-row: 3;
}


/* ================================
   INFO
================================ */

.info {
    text-align: center;
    color: #91afa4;
    line-height: 1.7;
}

.logout {
    display: block;
    margin: 20px auto 0;
    padding: 12px 25px;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
}

.logout:hover {
    background: rgba(255,255,255,0.2);
}


/* ================================
   MOBILE
================================ */

@media(max-width:600px) {

    header {
        padding: 0 20px;
    }

    .connection {
        flex-direction: column;
    }

    .connectButton {
        padding: 14px;
    }

    .controls {
        grid-template-columns: repeat(3, 75px);
        grid-template-rows: repeat(3, 75px);
    }

    .controlButton {
        width: 75px;
        height: 75px;
    }
}

</style>
</head>


<body>


<!-- =========================================
     LOGIN PAGE
========================================= -->

<div id="loginPage">

    <div class="loginBox">

        <div class="logo">🌱</div>

        <h1>AGRI ROBO</h1>

        <p>Secure Rover Control</p>

        <input
            type="text"
            id="username"
            placeholder="Username"
            autocomplete="username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button
            class="loginButton"
            onclick="login()"
        >
            LOGIN
        </button>

        <div id="errorMessage">
            Invalid username or password
        </div>

    </div>

</div>



<!-- =========================================
     MAIN APP
========================================= -->

<div id="app">

<header>

    <div class="brand">
        🌱 <span>AGRI ROBO</span>
    </div>

    <div class="status">

        <div
            id="statusDot"
            class="statusDot"
        ></div>

        <span id="statusText">
            Disconnected
        </span>

    </div>

</header>


<section class="hero">

    <h1>
        🚜 <span>AGRI ROBO</span>
    </h1>

    <p>
        Smart Wi-Fi Agricultural Rover
    </p>

</section>



<div class="container">


<!-- =========================================
     ESP32 CONNECTION
========================================= -->

<div class="panel">

    <h2>🔌 ESP32 Connection</h2>

    <br>

    <div class="connection">

        <input
            id="espIP"
            type="text"
            placeholder="192.168.1.50"
        >

        <button
            class="connectButton"
            onclick="connectESP()"
        >
            CONNECT
        </button>

    </div>

</div>



<!-- =========================================
     ROBOT STATUS
========================================= -->

<div class="panel robot">

    <h2>🤖 Rover Status</h2>

    <div class="robotEmoji">
        🚜
    </div>

    <div
        id="robotState"
        class="robotState"
    >
        READY
    </div>

</div>



<!-- =========================================
     CONTROLLER
========================================= -->

<div class="panel">

    <h2 style="text-align:center;">
        🎮 Control
    </h2>

    <div class="controls">

        <button
            class="controlButton forward"
            data-command="forward"
            ontouchstart="startDrive('forward', event)"
            ontouchend="stopDrive(event)"
            ontouchcancel="stopDrive(event)"
            onmousedown="startDrive('forward', event)"
            onmouseup="stopDrive(event)"
            onmouseleave="stopDrive(event)"
        >
            ▲
        </button>


        <button
            class="controlButton left"
            data-command="left"
            ontouchstart="startDrive('left', event)"
            ontouchend="stopDrive(event)"
            ontouchcancel="stopDrive(event)"
            onmousedown="startDrive('left', event)"
            onmouseup="stopDrive(event)"
            onmouseleave="stopDrive(event)"
        >
            ◀
        </button>


        <button
            class="controlButton stop"
            onclick="stopRobot()"
        >
            ■
        </button>


        <button
            class="controlButton right"
            data-command="right"
            ontouchstart="startDrive('right', event)"
            ontouchend="stopDrive(event)"
            ontouchcancel="stopDrive(event)"
            onmousedown="startDrive('right', event)"
            onmouseup="stopDrive(event)"
            onmouseleave="stopDrive(event)"
        >
            ▶
        </button>


        <button
            class="controlButton backward"
            data-command="backward"
            ontouchstart="startDrive('backward', event)"
            ontouchend="stopDrive(event)"
            ontouchcancel="stopDrive(event)"
            onmousedown="startDrive('backward', event)"
            onmouseup="stopDrive(event)"
            onmouseleave="stopDrive(event)"
        >
            ▼
        </button>

    </div>

</div>



<!-- =========================================
     INFORMATION
========================================= -->

<div class="panel info">

    <h2>⌨️ Keyboard Control</h2>

    <br>

    <p>
        W / ↑ &nbsp; Forward
    </p>

    <p>
        S / ↓ &nbsp; Backward
    </p>

    <p>
        A / ← &nbsp; Left
    </p>

    <p>
        D / → &nbsp; Right
    </p>

    <p>
        SPACE &nbsp; Stop
    </p>

    <button
        class="logout"
        onclick="logout()"
    >
        LOGOUT
    </button>

</div>


</div>

</div>



<script>


// ==========================================
// LOGIN
// ==========================================

const LOGIN_USERNAME = "admin";
const LOGIN_PASSWORD = "agri123";


function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    if (
        username === LOGIN_USERNAME &&
        password === LOGIN_PASSWORD
    ) {

        localStorage.setItem(
            "agriLoggedIn",
            "true"
        );

        document.getElementById(
            "loginPage"
        ).style.display = "none";

        document.getElementById(
            "app"
        ).style.display = "block";

    }

    else {

        document.getElementById(
            "errorMessage"
        ).style.display = "block";

    }

}



// ==========================================
// CHECK LOGIN
// ==========================================

if (
    localStorage.getItem("agriLoggedIn")
    === "true"
) {

    document.getElementById(
        "loginPage"
    ).style.display = "none";

    document.getElementById(
        "app"
    ).style.display = "block";

}



// ==========================================
// ESP32 IP
// ==========================================

let espIP =
    localStorage.getItem("agriESPIP")
    || "";


document.getElementById(
    "espIP"
).value = espIP;



// ==========================================
// FORMAT IP
// ==========================================

function getESPURL() {

    let ip =
        document.getElementById(
            "espIP"
        ).value.trim();


    if (!ip) {

        alert("Enter the ESP32 IP address.");

        return null;

    }


    if (!ip.startsWith("http://") &&
        !ip.startsWith("https://")) {

        ip = "http://" + ip;

    }


    return ip.replace(/\/$/, "");

}



// ==========================================
// CONNECT ESP32
// ==========================================

async function connectESP() {

    const url = getESPURL();

    if (!url) return;


    espIP = url;

    localStorage.setItem(
        "agriESPIP",
        espIP
    );


    setStatus(
        "Connecting...",
        false
    );


    try {

        const response =
            await fetch(
                espIP + "/ping",
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const text =
            await response.text();


        if (
            text.includes(
                "AGRI ROBO ONLINE"
            )
        ) {

            setStatus(
                "ESP32 Online",
                true
            );

            setRobotState(
                "CONNECTED"
            );

        }

        else {

            throw new Error(
                "Invalid ESP32 response"
            );

        }

    }

    catch(error) {

        console.error(error);

        setStatus(
            "Connection Failed",
            false
        );

        setRobotState(
            "ESP32 OFFLINE"
        );

        alert(
            "Unable to connect to ESP32.\n\n" +
            "Check:\n" +
            "1. ESP32 is powered ON\n" +
            "2. IP address is correct\n" +
            "3. Computer and ESP32 use the same Wi-Fi\n" +
            "4. Open http://ESP32-IP/ping directly"
        );

    }

}



// ==========================================
// SEND COMMAND
// ==========================================

async function sendCommand(
    command
) {

    if (!espIP) {

        alert(
            "Connect to the ESP32 first."
        );

        return false;

    }


    try {

        const response =
            await fetch(
                espIP + "/" + command,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const text =
            await response.text();


        console.log(
            command,
            text
        );


        setRobotState(
            command.toUpperCase()
        );


        return true;

    }

    catch(error) {

        console.error(
            "Command error:",
            error
        );

        setStatus(
            "Connection Lost",
            false
        );

        setRobotState(
            "OFFLINE"
        );

        return false;

    }

}



// ==========================================
// DRIVE LOOP
// ==========================================

let driveInterval = null;
let currentCommand = null;


function startDrive(
    command,
    event
) {

    if (event) {

        event.preventDefault();

    }


    if (
        currentCommand === command
        && driveInterval
    ) {

        return;

    }


    currentCommand = command;


    const button =
        document.querySelector(
            `[data-command="${command}"]`
        );


    if (button) {

        button.classList.add(
            "active"
        );

    }


    sendCommand(command);


    driveInterval =
        setInterval(
            function() {

                sendCommand(
                    command
                );

            },
            300
        );

}



function stopDrive(event) {

    if (event) {

        event.preventDefault();

    }


    if (driveInterval) {

        clearInterval(
            driveInterval
        );

        driveInterval = null;

    }


    if (currentCommand) {

        const button =
            document.querySelector(
                `[data-command="${currentCommand}"]`
            );


        if (button) {

            button.classList.remove(
                "active"
            );

        }

    }


    currentCommand = null;


    sendCommand("stop");

}



// ==========================================
// STOP BUTTON
// ==========================================

function stopRobot() {

    if (driveInterval) {

        clearInterval(
            driveInterval
        );

        driveInterval = null;

    }


    document.querySelectorAll(
        ".controlButton"
    ).forEach(
        button => {
            button.classList.remove(
                "active"
            );
        }
    );


    currentCommand = null;


    sendCommand("stop");

}



// ==========================================
// KEYBOARD CONTROL
// ==========================================

const keys = {

    "w": "forward",
    "ArrowUp": "forward",

    "s": "backward",
    "ArrowDown": "backward",

    "a": "left",
    "ArrowLeft": "left",

    "d": "right",
    "ArrowRight": "right"

};


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.target.tagName ===
            "INPUT"
        ) {

            return;

        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            stopRobot();

            return;

        }


        const command =
            keys[event.key];


        if (command) {

            event.preventDefault();

            startDrive(
                command,
                event
            );

        }

    }
);



document.addEventListener(
    "keyup",
    function(event) {

        const command =
            keys[event.key];


        if (command) {

            event.preventDefault();

            stopDrive(event);

        }

    }
);



// ==========================================
// STATUS
// ==========================================

function setStatus(
    text,
    online
) {

    document.getElementById(
        "statusText"
    ).textContent = text;


    const dot =
        document.getElementById(
            "statusDot"
        );


    if (online) {

        dot.classList.add(
            "online"
        );

    }

    else {

        dot.classList.remove(
            "online"
        );

    }

}



function setRobotState(
    text
) {

    document.getElementById(
        "robotState"
    ).textContent = text;

}



// ==========================================
// SAFETY STOP
// ==========================================

window.addEventListener(
    "blur",
    function() {

        stopRobot();

    }
);


document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.hidden
        ) {

            stopRobot();

        }

    }
);


window.addEventListener(
    "beforeunload",
    function() {

        if (espIP) {

            fetch(
                espIP + "/stop",
                {
                    method: "GET",
                    keepalive: true
                }
            ).catch(
                () => {}
            );

        }

    }
);


// ==========================================
// ENTER KEY LOGIN
// ==========================================

document.getElementById(
    "password"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            login();

        }

    }
);


// ==========================================
// LOGOUT
// ==========================================

function logout() {

    stopRobot();

    localStorage.removeItem(
        "agriLoggedIn"
    );

    location.reload();

}

</script>

</body>
</html>
