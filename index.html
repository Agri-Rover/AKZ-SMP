<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AGRI ROBO</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% 0%, #164d2a 0%, #07150b 45%, #030806 100%);
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 95%;
    max-width: 520px;
    padding: 20px;
}

.card {
    background: rgba(10, 25, 15, 0.94);
    border: 1px solid rgba(57,255,136,0.25);
    border-radius: 28px;
    padding: 25px;
    box-shadow:
        0 20px 60px rgba(0,0,0,0.5),
        0 0 30px rgba(57,255,136,0.06);
    backdrop-filter: blur(10px);
}


/* =========================
   HEADER
========================= */

.logo {
    text-align: center;
    font-size: 45px;
}

h1 {
    text-align: center;
    margin: 5px 0;
    font-size: 34px;
    letter-spacing: 3px;
    color: #39ff88;
}

.subtitle {
    text-align: center;
    color: #91cfa5;
    font-size: 13px;
    letter-spacing: 2px;
}


/* =========================
   CONNECTION
========================= */

.connection {
    margin-top: 25px;
    display: flex;
    gap: 10px;
}

#ip {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 13px;
    border: 1px solid #315d3e;
    background: #061009;
    color: white;
    font-size: 15px;
    outline: none;
}

#ip:focus {
    border-color: #39ff88;
}

.connect {
    padding: 14px 18px;
    border: none;
    border-radius: 13px;
    background: #238636;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.connect:active {
    transform: scale(0.96);
}


/* =========================
   STATUS
========================= */

.status {
    margin-top: 15px;
    padding: 13px;
    border-radius: 13px;
    text-align: center;
    background: #061009;
    border: 1px solid #1e492c;
    color: #39ff88;
    font-size: 15px;
}

.status.offline {
    color: #ff7777;
}


/* =========================
   CONTROLLER
========================= */

.controller {
    margin-top: 30px;
    text-align: center;
}

.row {
    display: flex;
    justify-content: center;
    align-items: center;
}

.control {
    width: 105px;
    height: 82px;
    margin: 6px;
    border: 1px solid #317844;
    border-radius: 22px;
    background: linear-gradient(145deg, #238636, #145622);
    color: white;
    font-size: 35px;
    cursor: pointer;

    box-shadow:
        0 8px 18px rgba(0,0,0,0.4),
        inset 0 1px rgba(255,255,255,0.08);

    user-select: none;
    -webkit-user-select: none;

    touch-action: none;

    transition: transform 0.08s, background 0.08s;
}

.control:active,
.control.pressed {
    transform: scale(0.93);
    background: #35a94e;
}

.stop {
    background: linear-gradient(145deg, #e53935, #991f1c);
    border-color: #ff5b57;
}

.stop:active,
.stop.pressed {
    background: #ff4540;
}


/* =========================
   SPEED
========================= */

.speed-box {
    margin-top: 25px;
    padding: 15px;
    background: #061009;
    border-radius: 15px;
}

.speed-title {
    color: #9bc8a8;
    font-size: 13px;
    margin-bottom: 8px;
}

input[type="range"] {
    width: 100%;
    accent-color: #39ff88;
}


/* =========================
   INFO
========================= */

.info {
    margin-top: 20px;
    text-align: center;
    color: #75927d;
    font-size: 12px;
    line-height: 1.7;
}

.footer {
    text-align: center;
    margin-top: 18px;
    color: #52685a;
    font-size: 11px;
}

</style>

</head>


<body>


<div class="container">

<div class="card">


<div class="logo">🌱</div>

<h1>AGRI ROBO</h1>

<div class="subtitle">
SMART AGRICULTURE ROVER
</div>


<!-- CONNECTION -->

<div class="connection">

<input
    id="ip"
    type="text"
    placeholder="ESP32 IP address"
>

<button
    class="connect"
    onclick="connectRover()">

CONNECT

</button>

</div>


<!-- STATUS -->

<div
    id="status"
    class="status">

NOT CONNECTED

</div>


<!-- CONTROLLER -->

<div class="controller">


<!-- FORWARD -->

<div class="row">

<button
    class="control"
    id="forward"
    data-command="forward">

⬆

</button>

</div>


<!-- LEFT STOP RIGHT -->

<div class="row">

<button
    class="control"
    id="left"
    data-command="left">

⬅

</button>


<button
    class="control stop"
    id="stop">

■

</button>


<button
    class="control"
    id="right"
    data-command="right">

➡

</button>

</div>


<!-- BACKWARD -->

<div class="row">

<button
    class="control"
    id="backward"
    data-command="backward">

⬇

</button>

</div>


</div>


<!-- SPEED -->

<div class="speed-box">

<div class="speed-title">
MOTOR SPEED
</div>

<input
    id="speed"
    type="range"
    min="20"
    max="100"
    value="70"
>

</div>


<div class="info">

<b>HOLD</b> a direction button to drive<br>
Release the button to automatically stop<br>
Keyboard: W A S D / Arrow Keys

</div>


<div class="footer">

ESP32 • L298N • AGRI ROBO

</div>


</div>

</div>


<script>


let roverIP = "";
let currentCommand = null;
let stopTimer = null;


// ============================================
// STATUS
// ============================================

function setStatus(text, offline = false) {

    const status =
        document.getElementById("status");

    status.innerText = text;

    if (offline) {
        status.classList.add("offline");
    } else {
        status.classList.remove("offline");
    }
}


// ============================================
// CONNECT
// ============================================

function connectRover() {

    let ip =
        document.getElementById("ip")
        .value
        .trim();

    if (!ip) {

        setStatus("ENTER ESP32 IP", true);

        return;
    }


    ip = ip
        .replace("http://", "")
        .replace("https://", "")
        .replace(/\/$/, "");


    roverIP = "http://" + ip;


    setStatus("CONNECTING...");


    fetch(roverIP + "/", {
        method: "GET",
        cache: "no-store"
    })

    .then(response => {

        if (!response.ok) {
            throw new Error();
        }

        return response.text();

    })

    .then(() => {

        setStatus("🟢 ROVER CONNECTED");

    })

    .catch(() => {

        roverIP = "";

        setStatus(
            "🔴 CONNECTION FAILED",
            true
        );

    });

}


// ============================================
// SEND COMMAND
// ============================================

function sendCommand(command) {

    if (!roverIP) {

        setStatus(
            "CONNECT ESP32 FIRST",
            true
        );

        return;

    }


    fetch(
        roverIP + "/" + command,
        {
            method: "GET",
            cache: "no-store"
        }
    )

    .then(response => response.text())

    .then(data => {

        setStatus("🚗 " + data);

    })

    .catch(() => {

        stopCar();

        setStatus(
            "🔴 ROVER DISCONNECTED",
            true
        );

    });

}


// ============================================
// STOP
// ============================================

function stopCar() {

    currentCommand = null;

    clearTimeout(stopTimer);


    document
        .querySelectorAll(".control")
        .forEach(button => {

            button.classList.remove("pressed");

        });


    if (!roverIP) {
        return;
    }


    fetch(
        roverIP + "/stop",
        {
            method: "GET",
            cache: "no-store"
        }
    )
    .catch(() => {});


    setStatus("■ STOPPED");

}


// ============================================
// START HOLD
// ============================================

function startDrive(command, button) {

    if (!roverIP) {

        setStatus(
            "CONNECT ESP32 FIRST",
            true
        );

        return;

    }


    // Stop previous direction first

    if (currentCommand &&
        currentCommand !== command) {

        sendCommand("stop");

    }


    currentCommand = command;

    button.classList.add("pressed");


    sendCommand(command);


    // Keep sending while button is held
    // This also acts as a communication heartbeat.

    clearInterval(button.holdTimer);


    button.holdTimer = setInterval(() => {

        if (currentCommand === command) {

            sendCommand(command);

        }

    }, 250);

}


// ============================================
// END HOLD
// ============================================

function endDrive(button) {

    clearInterval(button.holdTimer);

    button.classList.remove("pressed");

    stopCar();

}


// ============================================
// BUTTON EVENTS
// ============================================

document
.querySelectorAll("[data-command]")
.forEach(button => {


    const command =
        button.dataset.command;


    // Mouse

    button.addEventListener(
        "mousedown",
        function(event) {

            event.preventDefault();

            startDrive(
                command,
                button
            );

        }
    );


    button.addEventListener(
        "mouseup",
        function(event) {

            event.preventDefault();

            endDrive(button);

        }
    );


    button.addEventListener(
        "mouseleave",
        function() {

            if (currentCommand === command) {

                endDrive(button);

            }

        }
    );


    // Touch

    button.addEventListener(
        "touchstart",
        function(event) {

            event.preventDefault();

            startDrive(
                command,
                button
            );

        },
        { passive: false }
    );


    button.addEventListener(
        "touchend",
        function(event) {

            event.preventDefault();

            endDrive(button);

        },
        { passive: false }
    );


    button.addEventListener(
        "touchcancel",
        function(event) {

            event.preventDefault();

            endDrive(button);

        },
        { passive: false }
    );

});


// ============================================
// STOP BUTTON
// ============================================

const stopButton =
    document.getElementById("stop");


stopButton.addEventListener(
    "mousedown",
    function(event) {

        event.preventDefault();

        stopCar();

        stopButton.classList.add("pressed");

    }
);


stopButton.addEventListener(
    "mouseup",
    function() {

        stopButton.classList.remove("pressed");

    }
);


stopButton.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        stopCar();

        stopButton.classList.add("pressed");

    },
    { passive: false }
);


stopButton.addEventListener(
    "touchend",
    function(event) {

        event.preventDefault();

        stopButton.classList.remove("pressed");

    },
    { passive: false }
);


// ============================================
// KEYBOARD CONTROL
// ============================================

const keyMap = {

    "ArrowUp": "forward",
    "w": "forward",
    "W": "forward",

    "ArrowDown": "backward",
    "s": "backward",
    "S": "backward",

    "ArrowLeft": "left",
    "a": "left",
    "A": "left",

    "ArrowRight": "right",
    "d": "right",
    "D": "right"

};


let keyboardButton = null;


document.addEventListener(
    "keydown",
    function(event) {

        if (event.repeat) {
            return;
        }


        if (event.code === "Space") {

            event.preventDefault();

            stopCar();

            return;

        }


        const command =
            keyMap[event.key];


        if (!command) {
            return;
        }


        event.preventDefault();


        const button =
            document.querySelector(
                '[data-command="' +
                command +
                '"]'
            );


        if (button) {

            keyboardButton = button;

            startDrive(
                command,
                button
            );

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        if (event.code === "Space") {

            stopCar();

            return;

        }


        const command =
            keyMap[event.key];


        if (!command) {
            return;
        }


        event.preventDefault();


        if (keyboardButton) {

            endDrive(keyboardButton);

            keyboardButton = null;

        }

    }
);


// ============================================
// SAFETY STOP WHEN PAGE IS LEFT
// ============================================

window.addEventListener(
    "blur",
    function() {

        stopCar();

    }
);


document.addEventListener(
    "visibilitychange",
    function() {

        if (document.hidden) {

            stopCar();

        }

    }
);


</script>


</body>

</html>
