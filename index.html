<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Agri Robo | Owner Control</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;

    background:
        radial-gradient(circle at top,
        #174d2c,
        #071b10 55%,
        #020805);

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}


/* ================= LOGIN ================= */

#loginPage {

    width: 100%;
    max-width: 420px;

    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 25px;

    padding: 35px;

    text-align: center;

    backdrop-filter: blur(15px);

    box-shadow:
        0 20px 50px rgba(0,0,0,0.5);
}

.logo {

    font-size: 55px;

    margin-bottom: 10px;
}

h1 {

    font-size: 30px;

    margin-bottom: 5px;
}

.subtitle {

    color: #a8d8b5;

    margin-bottom: 30px;
}

input {

    width: 100%;

    padding: 15px;

    margin: 8px 0;

    border: none;

    border-radius: 12px;

    outline: none;

    background: rgba(255,255,255,0.12);

    color: white;

    font-size: 16px;
}

input::placeholder {

    color: #aaa;
}

.loginButton {

    width: 100%;

    margin-top: 15px;

    padding: 15px;

    border: none;

    border-radius: 12px;

    background: #28a745;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}

.loginButton:hover {

    background: #35c653;
}

#error {

    margin-top: 15px;

    color: #ff6b6b;

    min-height: 20px;
}


/* ================= CONTROL PAGE ================= */

#controlPage {

    display: none;

    width: 100%;

    max-width: 700px;
}

.header {

    text-align: center;

    margin-bottom: 20px;
}

.header h1 {

    font-size: 34px;
}

.header p {

    color: #a8d8b5;

    margin-top: 5px;
}


/* STATUS */

.status {

    text-align: center;

    background: rgba(255,255,255,0.08);

    padding: 15px;

    border-radius: 15px;

    margin-bottom: 25px;
}

.status span {

    font-weight: bold;

    color: #54e879;
}


/* CONTROLS */

.controls {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 15px;

    max-width: 500px;

    margin: auto;
}

.control {

    min-height: 100px;

    border: none;

    border-radius: 20px;

    font-size: 38px;

    cursor: pointer;

    background: rgba(255,255,255,0.12);

    color: white;

    box-shadow:
        0 8px 20px rgba(0,0,0,0.3);

    transition: 0.15s;
}

.control:active {

    transform: scale(0.92);
}

.forward {

    grid-column: 2;
}

.left {

    grid-column: 1;
    grid-row: 2;
}

.stop {

    grid-column: 2;
    grid-row: 2;

    background: #c62828;
}

.right {

    grid-column: 3;
    grid-row: 2;
}

.backward {

    grid-column: 2;
    grid-row: 3;
}


/* FOOTER */

.info {

    margin-top: 30px;

    padding: 18px;

    border-radius: 15px;

    background: rgba(255,255,255,0.06);

    text-align: center;

    color: #aaa;
}

.logout {

    margin-top: 15px;

    padding: 10px 20px;

    border: 1px solid #555;

    border-radius: 10px;

    background: transparent;

    color: white;

    cursor: pointer;
}


/* MOBILE */

@media(max-width:500px) {

    .control {

        min-height: 85px;

        font-size: 32px;
    }

    .header h1 {

        font-size: 28px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN PAGE
====================================================== -->

<div id="loginPage">

    <div class="logo">🌱🤖</div>

    <h1>AGRI ROBO</h1>

    <div class="subtitle">
        Owner Control System
    </div>


    <input
        type="text"
        id="username"
        placeholder="Owner username"
        autocomplete="off"
    >


    <input
        type="password"
        id="password"
        placeholder="Password"
    >


    <button
        class="loginButton"
        onclick="login()">

        LOGIN

    </button>


    <div id="error"></div>

</div>



<!-- =====================================================
     CONTROL PAGE
====================================================== -->

<div id="controlPage">

    <div class="header">

        <h1>🌱 AGRI ROBO 🤖</h1>

        <p>
            Smart Agricultural Rover
        </p>

    </div>


    <div class="status">

        Connection:
        <span id="connection">
            Not connected
        </span>

        <br>

        Command:
        <span id="command">
            STOP
        </span>

    </div>



    <div class="controls">

        <button
            class="control forward"
            onmousedown="startMove('forward')"
            onmouseup="stopMove()"
            ontouchstart="startMove('forward')"
            ontouchend="stopMove()">

            ⬆️

        </button>


        <button
            class="control left"
            onmousedown="startMove('left')"
            onmouseup="stopMove()"
            ontouchstart="startMove('left')"
            ontouchend="stopMove()">

            ⬅️

        </button>


        <button
            class="control stop"
            onclick="sendCommand('stop')">

            🛑

        </button>


        <button
            class="control right"
            onmousedown="startMove('right')"
            onmouseup="stopMove()"
            ontouchstart="startMove('right')"
            ontouchend="stopMove()">

            ➡️

        </button>


        <button
            class="control backward"
            onmousedown="startMove('backward')"
            onmouseup="stopMove()"
            ontouchstart="startMove('backward')"
            ontouchend="stopMove()">

            ⬇️

        </button>

    </div>



    <div class="info">

        <p>
            Hold a direction button to move.
        </p>

        <p>
            Release it to stop the rover.
        </p>


        <button
            class="logout"
            onclick="logout()">

            LOGOUT

        </button>

    </div>

</div>



<script>

/* =====================================================
   SETTINGS
====================================================== */


/*
   ESP32 Access Point IP

   Normally:
   192.168.4.1
*/

const ESP32_IP = "192.168.4.1";


/*
   CHANGE THESE LOGIN DETAILS
*/

const OWNER_USERNAME = "owner";

const OWNER_PASSWORD = "agri123";


/* =====================================================
   LOGIN
====================================================== */

function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    if (
        username === OWNER_USERNAME &&
        password === OWNER_PASSWORD
    ) {

        document.getElementById("loginPage")
            .style.display = "none";

        document.getElementById("controlPage")
            .style.display = "block";

        document.getElementById("connection")
            .innerText = "Ready";

    }

    else {

        document.getElementById("error")
            .innerText = "Incorrect username or password.";

    }

}


/* =====================================================
   SEND COMMAND
====================================================== */

function sendCommand(command) {

    const url =
        "http://" + ESP32_IP + "/" + command;


    fetch(url, {
        method: "GET",
        mode: "cors"
    })

    .then(response => {

        document.getElementById("connection")
            .innerText = "Connected";

        document.getElementById("command")
            .innerText =
            command.toUpperCase();

    })

    .catch(error => {

        document.getElementById("connection")
            .innerText = "Connection failed";

        console.log(error);

    });

}


/* =====================================================
   MOVEMENT
====================================================== */

let moving = false;


function startMove(command) {

    moving = true;

    sendCommand(command);

}


function stopMove() {

    if (moving) {

        moving = false;

        sendCommand("stop");

    }

}


/* =====================================================
   LOGOUT
====================================================== */

function logout() {

    sendCommand("stop");


    document.getElementById("controlPage")
        .style.display = "none";


    document.getElementById("loginPage")
        .style.display = "block";


    document.getElementById("username")
        .value = "";

    document.getElementById("password")
        .value = "";

}

</script>


</body>

</html>
