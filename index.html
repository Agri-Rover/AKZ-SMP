<!DOCTYPE html>
<html>
<head>
    <title>AGRI ROBO</title>

    <style>
        body {
            margin: 0;
            background: #07130a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            width: 320px;
            margin: 100px auto;
            padding: 30px;
            background: #102216;
            border-radius: 20px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .login {
            background: #39d353;
        }

        #error {
            color: red;
            display: none;
        }

        #roverPage {
            display: none;
        }

        .control {
            font-size: 30px;
            margin: 8px;
            width: 80px;
            height: 70px;
            background: #193b21;
            color: white;
        }

        .stop {
            background: red;
        }
    </style>
</head>

<body>

    <!-- LOGIN -->

    <div id="loginPage" class="box">

        <h1>🌱 AGRI ROBO 🤖</h1>

        <h3>Owner Login</h3>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <br>

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <br><br>

        <button class="login" onclick="login()">
            LOGIN
        </button>

        <p id="error">
            ❌ Wrong username or password
        </p>

    </div>


    <!-- ROVER CONTROL -->

    <div id="roverPage">

        <h1>🤖 AGRI ROBO</h1>

        <h2>Owner Control Panel</h2>

        <p id="status">
            Rover stopped
        </p>

        <br>

        <button
            class="control"
            onclick="move('forward')">
            ▲
        </button>

        <br>

        <button
            class="control"
            onclick="move('left')">
            ◀
        </button>

        <button
            class="control stop"
            onclick="move('stop')">
            ■
        </button>

        <button
            class="control"
            onclick="move('right')">
            ▶
        </button>

        <br>

        <button
            class="control"
            onclick="move('backward')">
            ▼
        </button>

        <br><br>

        <button onclick="logout()">
            LOGOUT
        </button>

    </div>


    <script>

        // =========================
        // YOUR LOGIN DETAILS
        // =========================

        const USERNAME = "owner";
        const PASSWORD = "agri123";


        // =========================
        // LOGIN
        // =========================

        function login() {

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;


            if (
                username === USERNAME &&
                password === PASSWORD
            ) {

                document.getElementById("loginPage")
                    .style.display = "none";

                document.getElementById("roverPage")
                    .style.display = "block";

                document.getElementById("error")
                    .style.display = "none";

            } else {

                document.getElementById("error")
                    .style.display = "block";
            }
        }


        // =========================
        // ROVER CONTROL
        // =========================

        function move(direction) {

            document.getElementById("status")
                .innerText =
                "Rover: " + direction.toUpperCase();

            console.log("Command:", direction);
        }


        // =========================
        // LOGOUT
        // =========================

        function logout() {

            document.getElementById("roverPage")
                .style.display = "none";

            document.getElementById("loginPage")
                .style.display = "block";

            document.getElementById("username")
                .value = "";

            document.getElementById("password")
                .value = "";
        }

    </script>

</body>
</html>
